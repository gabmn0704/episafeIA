# Mantiene despierto el back de Render (plan gratis duerme tras 15 min sin tráfico).
name: keepalive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 --retry 3 https://episafe-api.onrender.com/api/v1/health
